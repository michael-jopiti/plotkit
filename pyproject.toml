[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plotkit"
version = "0.1.0"
description = "Publication-ready scientific figures with matplotlib: one call, no overlaps."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.9", "pandas", "numpy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/michael-jopiti/plotkit"

[project.optional-dependencies]
polars = ["polars"]
latex = []
umap = ["umap-learn"]
dev = [
  "pytest", "pytest-cov", "pytest-mpl", "ruff", "mypy",
  "colorspacious", "pandas-stubs", "pillow", "scikit-learn", "umap-learn",
]

[tool.hatch.build.targets.wheel]
packages = ["src/plotkit"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213", "D105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "E501"]
"examples/*" = ["D"]
"main.py" = ["D", "B905", "E501"]
"tools/*" = ["D"]
"design/*" = ["D", "E501", "E741", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["colorspacious.*", "umap.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=plotkit --cov-report=term-missing"
filterwarnings = ["error::UserWarning:plotkit"]
